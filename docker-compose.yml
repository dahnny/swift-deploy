services:
  app:
    image: swift-deploy-1-node:latest
    container_name: swiftdeploy-app
    restart: unless-stopped
    environment:
      MODE: "canary"
      APP_VERSION: "1.0.0"
      APP_PORT: "3000"
    expose:
      - "3000"
    networks:
      - swiftdeploy
    volumes:
      - swiftdeploy-logs:/var/log/swiftdeploy
    user: swiftdeploy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:3000/healthz', timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  nginx:
    image: nginx:latest
    container_name: swiftdeploy-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8080:8080"
    networks:
      - swiftdeploy
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - swiftdeploy-logs:/var/log/nginx
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  opa:
    image: openpolicyagent/opa:latest
    container_name: swiftdeploy-opa
    restart: unless-stopped
    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - /policies
    ports:
      - "127.0.0.1:8181:8181"
    networks:
      - swiftdeploy
    volumes:
      - ./policies:/policies:ro
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

networks:
  swiftdeploy:
    name: swiftdeploy-net
    driver: bridge

volumes:
  swiftdeploy-logs:
    name: swiftdeploy-logs
