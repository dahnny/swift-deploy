services:
  image: swift-deploy-1-node:latest
  port: 3000
  mode: canary
  app_version: "1.0.0"

nginx:
  image: nginx:latest
  port: 8080
  proxy_timeout: 10s
  contact: admin@example.com

network:
  name: swiftdeploy-net
  driver_type: bridge

policies:
  min_disk_free_gb: 10
  max_cpu_load_1m: 10.0
  max_error_rate: 0.01
  max_p99_latency_seconds: 0.5
  window_seconds: 30

restart_policy: unless-stopped
